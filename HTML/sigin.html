<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Sign In</title>
  <link rel="stylesheet" href="../CSS/sigin.css" />
</head>
<body>
  <div class="bg-bubbles">

  <div class="signin-wrap">

      <form>
        <input type="email" placeholder="Email" />

        <a href="#">LinkedIn</a>

</html>
